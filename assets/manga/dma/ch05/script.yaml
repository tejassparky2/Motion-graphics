# Source: approved continuation v6 (story/continuation_v6_approved.md), Parts 10-12.
#
# Conventions (as in chapters 1-4):
#   canon: true  -> verbatim from the approved continuation (CONFIRMED CANON)
#   (no flag)    -> new text for this draft (PROPOSAL — NOT CANON). Here only SFX.
#   Narration (Ren, first person) is lettered as captions.
#   Reading order is right to left; rows list cells right to left.
#   The chapter title "Thirty Tokens" is Part 12's approved title.
#
# The board. Rows by entry order, from the approved script (Parts 10-11):
#   1 Riku 19 · 2 Ren 9 · 3 Yui 10 · 4 Aoi 9 · 5 Mio 10 · 6-8 three unnamed students
#   · 9 Haruto 10 · 10 Gō 10 NOT FOUND · 11 Kota 9 · 12-19 the other unnamed students.
#   Unnamed students' names are not canon, so their names are drawn out of focus.
#   Canon says only that everyone but Gō found theirs "in 9 or 10" ("nines and tens on
#   the board"); which unnamed slot shows 9 and which 10 is staging, not canon.
#
# Page 9 (Gō in the locker room) is staging of canon facts with no words: Gō opens ten
# lockers without finding his name, cuts the loop (first and tenth), and the panel goes
# black, as Saki's death did in Chapter 3. No gore. Haruto's swap is never shown.
# Page 19's flashback reuses Chapter 1's panel p03_6 (copied in as ch01_p03_6.png).

