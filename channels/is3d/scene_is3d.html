// ---------- direction ----------
const beats = T.beats, SHOTS = D.SHOTS, DIR = D.DIR;
window.DURATION = T.total;
function beatAt(t) { let cur = beats[0], prev = beats[0]; for (const b of beats) { if (b.start - .12 <= t) { prev = cur; cur = b; } } return [cur, prev]; }
const dirOf = (b, who) => (DIR[b.id] && DIR[b.id][who]) || null;
function envAt(who, t) { const e = T.env[who]; if (!e) return 0; const i = Math.round(t * T.fps); return e[Math.min(e.length - 1, Math.max(0, i))] || 0; }
function mixEmo(a, b, u) { const r = {}; for (const k of ["brow", "ang", "lid", "smile", "wide", "happyEyes"]) r[k] = lerp(a[k] || 0, b[k] || 0, u);
  r.look = [lerp(a.look[0], b.look[0], u), lerp(a.look[1], b.look[1], u)]; return r; }
function lastDir(who, upto) {    // a character keeps its last direction on lines that don't mention it
  let d = null; for (const b of beats) { if (b.start > upto) break; if (dirOf(b, who)) d = dirOf(b, who); } return d || ["neutral", "rest"];
}
function emotionFor(who, t) {
  const [cur, prev] = beatAt(t);
  const a = EMO[lastDir(who, prev.start)[0]] || EMO.neutral, b = EMO[lastDir(who, cur.start)[0]] || EMO.neutral;
  const p = mixEmo(a, b, seg(t, cur.start - .12, cur.start + .12));
  const talk = Math.max(envAt(who, t), envAt(who, t - 1 / 30) * .6);
  p.open = clamp(talk * 1.15); if (talk > .1) p.happyEyes = Math.min(p.happyEyes, .4); p.talk = talk;
  return p;
}
function shotAt(t) {

  const cuts = DIR[cur.id] && DIR[cur.id].cuts;
  if (cuts) { const len = Math.max(.3, cur.end - cur.start);
    cuts.forEach(([f, n], i) => { const a = cur.start + f * len; if (i === 0 || t >= a) { name = n; s0 = i === 0 ? cur.start - .15 : a; s1 = i + 1 < cuts.length ? cur.start + cuts[i + 1][0] * len : cur.end + .6; } if (i > 0) cutT = cutT ?? a; }); }
  return {name, s0, s1, cutT, shot: SHOTS[name]};
}

window.renderAt = function (t) {

  bed.lampLight.intensity = atNight ? 2.4 : 0; bed.moon.intensity = atNight ? .55 : 0; bed.shade.material.emissiveIntensity = atNight ? 1.2 : 0;

  teacher.head.rotation.x = .05 + .05 * te.talk * Math.sin(t * 10);
