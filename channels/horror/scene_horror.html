  const q = fig.root.getWorldQuaternion(new THREE.Quaternion());
  const f = new THREE.Vector3(0, 0, 1).applyQuaternion(q).setY(0).normalize(), r = new THREE.Vector3(-f.z, 0, f.x);
  const P = h.clone().addScaledVector(f, o.dist ?? .55).addScaledVector(r, o.side ?? .12); P.y += o.up ?? .03;
  return {pos: P.toArray(), look: [h.x, h.y + (o.lookUp ?? 0), h.z], fov: o.fov ?? 40, push: o.push ?? .06, drift: o.drift};
};
const S = await SET.build(ctx);

// shot = {pos, look, fov, push, drift}: hard cut per line, slow push-in, handheld drift; sets can override it
function shotFor(t) {
  const [cur] = beatAt(t);
  const cuts = S.CUTS && S.CUTS[cur.id];
  let name = cur.scene, s0 = cur.start - .15, s1 = cur.end + .5;
  if (cuts) { const len = Math.max(.3, cur.end - cur.start);
    cuts.forEach(([f, n], i) => { const a = cur.start + f * len; if (i === 0 || t >= a) { name = n; s0 = i === 0 ? cur.start - .15 : a; s1 = i + 1 < cuts.length ? cur.start + cuts[i + 1][0] * len : cur.end + .5; } }); }
  return {name, s0, s1, shot: S.SHOTS[name]};
}
window.renderAt = function (t) {
  const sh = shotFor(t);
  const [cur, prev] = beatAt(t);
  S.update(t, cur, prev, sh);
  let shot = sh.shot; if (typeof shot === "function") { scene.updateMatrixWorld(true); shot = shot(t, sh); }
  const k = seg(t, sh.s0, sh.s1);
  const P = new THREE.Vector3(...shot.pos), L = new THREE.Vector3(...shot.look);
  if (shot.to) P.lerp(new THREE.Vector3(...shot.to), k);
  const dir = L.clone().sub(P).normalize();
  P.addScaledVector(dir, (shot.push ?? .12) * k);
  const d = shot.drift ?? 1;
  P.x += noise(t * .6, 1) * .012 * d; P.y += noise(t * .5, 4) * .009 * d;
  L.x += noise(t * .4, 7) * .006 * d;
  if (S.shake) { const a = S.shake(t); P.x += a * noise(t * 30, 2) * .03; P.y += a * noise(t * 33, 5) * .03; }
  camera.fov = shot.fov || 40; camera.updateProjectionMatrix();
  camera.position.copy(P); camera.lookAt(L);
  if (shot.roll) camera.rotateZ(shot.roll);
  composer.render();
};
window.renderAt(0);
window.READY = true;
</script>
