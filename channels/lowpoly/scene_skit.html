<script type="module">
// Low-poly skit test (separate channel): Dev, Claude (orange helper) and Codex (blue robot) at a desk at night.
// Original designs. timing.json (from make_skit.py) gives each line's start/end and a mouth envelope per character;
// DIRECTION below says, per line, which shot to use and how each character feels and moves.
import * as THREE from "three";

const T = await (await fetch("/timing.json")).json();
const W = 720, H = 1280;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f1a);
scene.fog = new THREE.Fog(0x0d0f1a, 3.5, 7);
const camera = new THREE.PerspectiveCamera(38, W / H, 0.02, 30);

// ---------- helpers ----------
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function jitter(geo, amt) {
  const p = geo.attributes.position, map = new Map();
  for (let i = 0; i < p.count; i++) {
    const k = [p.getX(i), p.getY(i), p.getZ(i)].map(v => v.toFixed(4)).join(",");
    if (!map.has(k)) map.set(k, [(rnd() - .5) * amt, (rnd() - .5) * amt, (rnd() - .5) * amt]);
    const d = map.get(k);
    p.setXYZ(i, p.getX(i) + d[0], p.getY(i) + d[1], p.getZ(i) + d[2]);
  }
  geo.computeVertexNormals();
  return geo;
}
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({color: c, flatShading: true, roughness: .8, metalness: 0, ...o});
const basic = c => new THREE.MeshBasicMaterial({color: c});
function mesh(geo, m, cast = true) { const x = new THREE.Mesh(geo, m); x.castShadow = cast; x.receiveShadow = true; return x; }
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const seg = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const backOut = u => { const s = 2.2; u -= 1; return u * u * ((s + 1) * u + s) + 1; };

// ---------- room ----------
scene.add(new THREE.HemisphereLight(0x8a9cff, 0x1a1420, .55));

  const frameM = mat(0x3a3448);
  for (const [x, y, w, h] of [[0, 2.06, 1.6, .06], [0, 1.04, 1.6, .06], [-.78, 1.55, .06, 1.06], [.78, 1.55, .06, 1.06], [0, 1.55, .04, 1.0]]) {
    const b = mesh(new THREE.BoxGeometry(w, h, .05), frameM); b.position.set(x, y, 1.32); scene.add(b);
  }
  const dot = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.4, "rgba(255,255,255,.5)");

  for (let i = 0; i < 40; i++) {

  }

  }
  const poster = mesh(new THREE.PlaneGeometry(.45, .6), basic(0x2f4f6f)); poster.position.set(.55, 1.75, -1.88); scene.add(poster);
  const ps = mesh(new THREE.PlaneGeometry(.3, .08), basic(0xffb36b)); ps.position.set(.55, 1.88, -1.875); scene.add(ps);
  const neon = mesh(new THREE.TorusGeometry(.12, .012, 6, 24), new THREE.MeshBasicMaterial({color: 0xff7a59}));
  neon.position.set(.05, 1.95, -1.86); scene.add(neon);
  // desk
  const desk = mesh(new THREE.BoxGeometry(1.7, .06, .85), mat(0x5a4032)); desk.position.set(0, .72, 0); scene.add(desk);
  for (const z of [-.43, .43]) {               // purple neon strip along the desk edges
    const n = mesh(new THREE.BoxGeometry(1.7, .012, .012), new THREE.MeshBasicMaterial({color: 0x9d7bff}), false); n.position.set(0, .705, z); scene.add(n);
  }
  const neonLight = new THREE.PointLight(0x8a6bff, 1.6, 1.6, 1.5); neonLight.position.set(0, .62, .5); scene.add(neonLight);
  for (const [x, z] of [[-.8, -.38], [.8, -.38], [-.8, .38], [.8, .38]]) {
    const l = mesh(new THREE.BoxGeometry(.05, .7, .05), mat(0x3a2a22)); l.position.set(x, .35, z); scene.add(l);
  }
  // monitor (seen from behind / side), keyboard, mug, desk lamp
  const mon = new THREE.Group(); mon.position.set(.5, .75, .05); mon.rotation.y = -2.6; scene.add(mon);
  const panel = mesh(new THREE.BoxGeometry(.62, .38, .03), mat(0x1b1d26)); panel.position.y = .32; mon.add(panel);
  const glow = mesh(new THREE.PlaneGeometry(.58, .34), new THREE.MeshBasicMaterial({color: 0x8fb6ff})); glow.position.set(0, .32, .017); mon.add(glow);
  const stand = mesh(new THREE.BoxGeometry(.05, .14, .05), mat(0x2a2c36)); stand.position.y = .07; mon.add(stand);
  const kb = mesh(new THREE.BoxGeometry(.42, .02, .14), mat(0x2b2d38)); kb.position.set(.15, .76, -.22); scene.add(kb);
  const mug = mesh(new THREE.CylinderGeometry(.045, .04, .1, 8), mat(0xe8e4dc)); mug.position.set(-.45, .8, -.2); scene.add(mug);
  const lampG = new THREE.Group(); lampG.position.set(-.62, .75, .12); scene.add(lampG);
  const lb = mesh(new THREE.CylinderGeometry(.07, .08, .03, 8), mat(0x2a2a33)); lampG.add(lb);
  const la = mesh(new THREE.CylinderGeometry(.012, .012, .45, 6), mat(0x2a2a33)); la.position.set(.0, .22, 0); la.rotation.z = -.25; lampG.add(la);
  const lh = mesh(new THREE.ConeGeometry(.09, .12, 8, 1, true), mat(0xe86a3a, {side: THREE.DoubleSide})); lh.position.set(.08, .45, -.05); lh.rotation.z = 2.4; lampG.add(lh);
  const chair = mesh(new THREE.BoxGeometry(.5, .5, .08), mat(0x2b2e3c)); chair.position.set(0, .82, -1.02); scene.add(chair);

// ---------- expressive face kit ----------
// p = {brow: raise, ang: inner-up angle, lid: 0 open..1 shut, smile: -1..1, open: 0..1, look: [x, y], wide: eye scale}
function buildFace(parent, o) {
  const f = {o, eyes: [], pupils: [], brows: []};
  const g = new THREE.Group(); g.position.set(0, o.y, o.z); parent.add(g); f.group = g;
  for (const s of [-1, 1]) {
    const e = new THREE.Group(); e.position.set(s * o.sp, 0, 0); g.add(e); f.eyes.push(e);
    if (o.sclera) {
      const sc = new THREE.Mesh(new THREE.SphereGeometry(o.er, 14, 10), basic(0xf4f1ec)); sc.scale.z = .45; e.add(sc);
      const pu = new THREE.Mesh(new THREE.SphereGeometry(o.er * .55, 12, 8), basic(0x1b1420)); pu.position.z = o.er * .3; pu.scale.z = .4; e.add(pu); f.pupils.push(pu);
      const hi = new THREE.Mesh(new THREE.SphereGeometry(o.er * .16, 6, 4), basic(0xffffff)); hi.position.set(o.er * .2, o.er * .25, o.er * .55); pu.add(hi);
    } else {
      const pu = new THREE.Mesh(o.rect ? new THREE.BoxGeometry(o.er * 1.15, o.er * 2.3, o.er * .8) : new THREE.SphereGeometry(o.er, 14, 10), o.eyeMat);
      if (!o.rect) pu.scale.z = .45; e.add(pu); f.pupils.push(pu);
      if (!o.glow && !o.rect) { const hi = new THREE.Mesh(new THREE.SphereGeometry(o.er * .28, 6, 4), basic(0xffffff)); hi.position.set(o.er * .3, o.er * .35, o.er * .4); e.add(hi); }
    }
    const arc = new THREE.Mesh(new THREE.TorusGeometry(o.er * .9, o.er * .22, 6, 12, Math.PI), o.eyeMat || basic(0x1b1420));
    arc.position.set(s * o.sp, -o.er * .2, o.er * .3); arc.visible = false; g.add(arc); (f.arcs ||= []).push(arc);
    const br = new THREE.Mesh(new THREE.BoxGeometry(o.er * 2.2, o.er * .45, o.er * .4), o.browMat || basic(0x1b1420));
    br.position.set(s * o.sp, o.er * 1.6, o.er * .2); g.add(br); f.brows.push(br);
  }
  const mm = o.mouthMat || basic(0x1b1420);
  f.arc = new THREE.Mesh(new THREE.TorusGeometry(o.mw, o.mw * .2, 6, 14, Math.PI), mm); f.arc.position.set(0, -o.my, o.er * .2); g.add(f.arc);
  f.hole = new THREE.Mesh(new THREE.SphereGeometry(o.mw, 14, 10), o.glow ? mm : basic(0x5a1622)); f.hole.position.set(0, -o.my, 0); f.hole.scale.z = .3; g.add(f.hole);
  if (!o.glow) { f.tongue = new THREE.Mesh(new THREE.SphereGeometry(o.mw * .55, 10, 6), basic(0xd8546a)); f.tongue.position.set(0, -o.mw * .45, o.mw * .1); f.tongue.scale.z = .3; f.hole.add(f.tongue); }
  return f;
}
function poseFace(f, p, t, blinkPh) {
  const o = f.o;
  const bl = (u => u < .13 ? Math.sin(u / .13 * Math.PI) : 0)((t + blinkPh) % 3.3);
  const lid = clamp(Math.max(p.lid, bl));
  const happy = (p.happyEyes || 0) > .5;
  f.eyes.forEach((e, i) => {
    e.visible = !happy;
    const w = p.wide || 1;
    e.scale.set(w, w * Math.max(.06, 1 - lid), w);
    e.position.y = -o.er * .25 * lid;
  });
  f.arcs.forEach(a => a.visible = happy);
  f.pupils.forEach(pu => { if (o.sclera) pu.position.set(p.look[0] * o.er * .45, p.look[1] * o.er * .4, o.er * .3); });
  if (!o.sclera && !o.glow) f.pupils.forEach((pu, i) => f.eyes[i].position.x = (i ? 1 : -1) * o.sp + p.look[0] * o.er * .4);
  f.brows.forEach((b, i) => {
    const s = i ? 1 : -1;
    b.position.y = o.er * 1.6 + p.brow * o.er * 2.2 - lid * o.er * .5;
    b.rotation.z = -s * p.ang;
  });
  const open = clamp(p.open);
  f.hole.visible = open > .08;
  f.arc.visible = !f.hole.visible && !(o.quietMouth && Math.abs(p.smile) < .6);
  f.hole.scale.set((p.mwide || 1) * (.75 + .25 * open), .2 + 1.0 * open, .3);
  f.hole.position.y = -o.my - o.mw * .3 * open;
  const sm = p.smile;
  f.arc.rotation.z = sm >= 0 ? Math.PI : 0;
  f.arc.scale.set(p.mwide || 1, Math.max(.18, Math.abs(sm)), 1);
  f.arc.position.y = -o.my + (sm >= 0 ? o.mw * .5 : -o.mw * .4) * Math.abs(sm);
}

// ---------- Dev ----------
const SKIN = mat(0xe0a07a), HOOD = mat(0x3d5a6e), HAIR = mat(0x2a1d18);

}

    tuft.position.set(Math.cos(a) * .1, .12 + rnd() * .03, Math.sin(a) * .09 - .02);
    tuft.rotation.set(Math.sin(a) * .9 - .2, 0, -Math.cos(a) * .9); devHead.add(tuft);
  }
  const capH = mesh(jitter(new THREE.SphereGeometry(.165, 9, 6, 0, Math.PI * 2, 0, Math.PI * .45), .015), HAIR);
  capH.position.set(0, .03, -.015); capH.rotation.x = -.25; devHead.add(capH);
  const fringe = mesh(jitter(new THREE.ConeGeometry(.06, .12, 4), .01), HAIR); fringe.position.set(.05, .12, .12); fringe.rotation.set(1.9, 0, .4); devHead.add(fringe);
  for (const s of [-1, 1]) { const ear = mesh(new THREE.IcosahedronGeometry(.035, 0), SKIN); ear.position.set(s * .16, 0, 0); devHead.add(ear); }
  const nose = mesh(new THREE.IcosahedronGeometry(.025, 0), SKIN); nose.position.set(0, -.02, .155); devHead.add(nose);
  for (const s of [-1, 1]) {                   // round glasses
    const rimG = new THREE.Mesh(new THREE.TorusGeometry(.042, .006, 5, 16), basic(0x1a1a22)); rimG.position.set(s * .06, .02, .155); devHead.add(rimG);
  }
  const bridge = new THREE.Mesh(new THREE.BoxGeometry(.035, .006, .006), basic(0x1a1a22)); bridge.position.set(0, .025, .158); devHead.add(bridge);
}
const devFace = buildFace(devHead, {y: .02, z: .148, sp: .06, er: .022, sclera: true, mw: .028, my: .085, browMat: basic(0x2a1d18)});
function arm(parent, s, upper, fore, m, hand) {
  const sh = new THREE.Group(); sh.position.set(s * .21, 1.0, 0); parent.add(sh);
  const u = mesh(new THREE.CylinderGeometry(.045, .05, upper, 6), m); u.position.y = -upper / 2; sh.add(u);
  const el = new THREE.Group(); el.position.y = -upper; sh.add(el);
  const f = mesh(new THREE.CylinderGeometry(.04, .045, fore, 6), m); f.position.y = -fore / 2; el.add(f);
  const h = mesh(jitter(new THREE.IcosahedronGeometry(.045, 0), .01), hand); h.position.y = -fore - .02; el.add(h);
  return {sh, el, s};
}
const devArms = [arm(devBody, -1, .27, .25, HOOD, SKIN), arm(devBody, 1, .27, .25, HOOD, SKIN)];

// ---------- Claude: the Claude Code mascot (orange block, two upright eyes, side nubs, four legs), in low poly ----------

// ---------- direction (per episode: directions/<name>.js, picked with ?dir=<name>) ----------
// emotions: brow, ang (inner-up), lid, smile, wide, look, happyEyes
const EMO = {
  neutral:  {brow: 0, ang: 0, lid: .12, smile: .15, wide: 1, look: [0, 0]},
  tired:    {brow: -.1, ang: .12, lid: .45, smile: -.25, wide: 1, look: [0, -.3]},
  annoyed:  {brow: -.25, ang: -.35, lid: .35, smile: -.45, wide: 1, look: [0, -.4]},
  shocked:  {brow: .45, ang: .15, lid: 0, smile: -.1, wide: 1.25, look: [0, -.5]},
  panic:    {brow: .5, ang: .45, lid: 0, smile: -.5, wide: 1.35, look: [0, -.5]},
  hopeful:  {brow: .2, ang: .3, lid: .25, smile: .25, wide: 1, look: [0, -.4]},
  casual:   {brow: .15, ang: .1, lid: .3, smile: .35, wide: 1, look: [.7, .1]},
  ashamed:  {brow: .05, ang: .45, lid: .45, smile: -.4, wide: 1, look: [.3, -.6]},
  eager:    {brow: .3, ang: 0, lid: 0, smile: .9, wide: 1.1, look: [0, .3], happyEyes: 0},
  proud:    {brow: .15, ang: -.1, lid: .3, smile: 1, wide: 1, look: [0, .3], happyEyes: 1},
  warm:     {brow: .2, ang: .15, lid: 0, smile: .9, wide: 1, look: [0, .3], happyEyes: 1},
  sheepish: {brow: .3, ang: .4, lid: .15, smile: .45, wide: 1, look: [.8, .2]},
  oops:     {brow: .4, ang: .35, lid: 0, smile: -.35, wide: 1.2, look: [-.5, .2]},
  horrified:{brow: .5, ang: .3, lid: 0, smile: -.7, wide: 1.4, look: [0, -.4]},
  reading:  {brow: .1, ang: .15, lid: .2, smile: 0, wide: 1, look: [0, -.6]},
  suspicious:{brow: -.25, ang: -.4, lid: .55, smile: 0, wide: 1, look: [0, .3]},
  done:     {brow: -.15, ang: .2, lid: .95, smile: -.5, wide: 1, look: [0, -.5]},
  watch:    {brow: .1, ang: .2, lid: .1, smile: -.1, wide: 1, look: [0, .3]},
  hidden:   {brow: 0, ang: 0, lid: .1, smile: 0, wide: 1, look: [0, 0]},
};
const SHOTS = {
  dev:    {pos: [.05, 1.2, .95], look: [0, 1.1, -.95], push: .15, fov: 42},
  claude: {pos: [-.33, 1.15, -1.05], look: [-.18, .87, -.05], push: .12, fov: 50},
  claudeclose: {pos: [-.3, 1.08, -.95], look: [-.18, .88, -.05], push: .35, fov: 46},
  codex:  {pos: [.36, 1.22, -1.05], look: [.2, .96, .02], push: .12, fov: 50},
  duo:    {pos: [.02, 1.25, -1.15], look: [.01, .9, 0], push: .12, fov: 52},
  wide:   {pos: [0, 1.75, 1.2], look: [0, .95, -.45], push: .2, fov: 46},
};
const DIRNAME = new URLSearchParams(location.search).get("dir") || "test";
const D = await import(`./directions/${DIRNAME}.js`);
Object.assign(SHOTS, D.SHOTS || {});
const DIR = D.DIR;
const beats = T.beats;
window.DURATION = T.total;
function beatAt(t) { let cur = beats[0], prev = beats[0]; for (const b of beats) { if (b.start - .12 <= t) { prev = cur; cur = b; } } return [cur, prev]; }
const dirOf = (b, who) => (DIR[b.id] && DIR[b.id][who]) || ["neutral", "idle"];
function mixEmo(a, b, u) {
  const r = {}; for (const k of ["brow", "ang", "lid", "smile", "wide", "happyEyes"]) r[k] = lerp(a[k] || 0, b[k] || 0, u);
  r.look = [lerp(a.look[0], b.look[0], u), lerp(a.look[1], b.look[1], u)]; return r;
}
function envAt(who, t) { const e = T.env[who]; const i = Math.round(t * T.fps); return e[Math.min(e.length - 1, Math.max(0, i))] || 0; }
function emotionFor(who, t) {
  const [cur, prev] = beatAt(t);
  const a = EMO[dirOf(prev, who)[0]] || EMO.neutral, b = EMO[dirOf(cur, who)[0]] || EMO.neutral;
  const p = mixEmo(a, b, seg(t, cur.start - .12, cur.start + .12));
  const talk = envAt(who, t), talkS = Math.max(talk, envAt(who, t - 1 / 30) * .6);
  p.open = clamp(talkS * 1.15);
  if (talkS > .1) p.happyEyes = Math.min(p.happyEyes, .4);
  p.talk = talkS;
  return p;
}
function setArm(a, shX, shZ, elX) { a.sh.rotation.set(shX, 0, a.s * shZ); a.el.rotation.set(elX, 0, 0); }
const POSES = {   // [right shoulder x, z, elbow x], [left ...]
  rest:     [[-.5, .15, -1.1], [-.5, .15, -1.1]],
  point:    [[-1.35, .05, -.15], [-.5, .15, -1.1]],
  lean:     [[-.9, .45, -1.4], [-.9, .45, -1.4]],
  pray:     [[-1.0, -.25, -1.6], [-1.0, -.25, -1.6]],
  facepalm: [[-2.0, -.2, -2.3], [-.5, .15, -1.1]],
  slide:    [[-1.25, .05, -.35], [-1.25, .05, -.35]],
  sip:      [[-1.1, -.35, -2.25], [-.5, .15, -1.1]],
  sink:     [[-.25, .12, -.7], [-.25, .12, -.7]],
  lunge:    [[-1.55, .1, -.15], [-1.55, .1, -.15]],
  hood:     [[-2.4, -.35, -2.0], [-2.4, -.35, -2.0]],
};
const BODY = {    // pose -> [lean forward, sink down, head down]
  lean: [1, 0, -.12], lunge: [1.5, 0, -.15], slide: [.6, 0, .1], sink: [-.3, 1, .3], hood: [.2, .6, .45],
  facepalm: [0, .4, .35],
};
const poseFrom = name => POSES[name] || POSES.rest;
const bodyFrom = name => BODY[name] || [0, 0, 0];
const firstShown = beats.find(b => dirOf(b, "codex")[0] !== "hidden");
const popT = (dirOf(beats[0], "codex")[0] === "hidden" && firstShown) ? firstShown.start - .35 : -1;

window.renderAt = function (t) {
  const [cur, prev] = beatAt(t);
  const u = seg(t, cur.start - .15, cur.start + .2);
  // ----- Dev
  const dp = emotionFor("dev", t);
  const devPose = dirOf(cur, "dev")[1], devPrev = dirOf(prev, "dev")[1];
  const pa = poseFrom(devPrev), pb = poseFrom(devPose);
  devArms.forEach((a, i) => { const A = pa[1 - i], B = pb[1 - i]; setArm(a, lerp(A[0], B[0], u), lerp(A[1], B[1], u), lerp(A[2], B[2], u)); });
  if (devPose === "point") devArms[1].el.rotation.x += Math.sin(t * 9) * .08 * envAt("dev", t);
  if (devPose === "lunge") devArms.forEach((a, i) => a.el.rotation.x += Math.sin(t * 18 + i) * .12);
  const ba = bodyFrom(devPrev), bb = bodyFrom(devPose);
  const lean = lerp(ba[0], bb[0], u), sink = lerp(ba[1], bb[1], u), hdown = lerp(ba[2], bb[2], u);
  devBody.position.z = .1 * lean;
  devBody.position.y = Math.sin(t * 2.2) * .004 - .06 * sink;
  devBody.rotation.x = .12 * lean - .08 * sink;
  devHead.rotation.x = .18 + hdown + .25 * dp.talk * Math.sin(t * 11) * .3;
  devHead.rotation.z = .06 * Math.sin(t * 1.3) + (dirOf(cur, "dev")[0] === "hopeful" ? .15 * u : 0);
  devHead.rotation.y = dirOf(cur, "dev")[0] === "casual" ? -.35 * u : -.05;
  handMug.visible = devPose === "sip";
  const hood = devPose === "hood" ? seg(t, cur.start - .1, cur.start + .5) : (devPrev === "hood" ? 1 - u : 0);
  hoodUp.visible = hood > .02 || (cur.id === beats[beats.length - 1].id && D.HOOD_AT_END);
  hoodUp.rotation.x = lerp(-1.7, .35, hood);
  poseFace(devFace, dp, t, .4);
  devFace.group.visible = hood < .85;

  // ----- Claude
  const cp = emotionFor("claude", t);
  poseFace(clFace, cp, t, 1.9);
  const clPose = dirOf(cur, "claude")[1];
  const frozen = clPose === "freeze";
  const hop = clPose === "cheer" ? Math.abs(Math.sin((t - cur.start) * 9)) * .03 * (1 - seg(t, cur.start + .8, cur.start + 1.4)) : 0;
  const talkBob = cp.talk * .012 * Math.abs(Math.sin(t * 16));
  clBody.position.y = hop + talkBob + (frozen ? 0 : .004 * Math.sin(t * 3));
  clBody.scale.set(1 + .06 * cp.talk, 1 - .05 * cp.talk + (clPose === "cheer" ? .04 * hop / .03 : 0) - (frozen ? .03 * u : 0), 1);
  clBody.rotation.z = clPose === "headscratch" ? .12 * Math.sin(t * 2) : clPose === "salute" ? .08 : frozen ? .03 * Math.sin(t * 40) * (1 - seg(t, cur.start, cur.start + .3)) : 0;
  clBody.rotation.y = clPose === "headscratch" ? .35 : clPose === "lookdown" ? 0 : 0;
  clBody.rotation.x = clPose === "lookdown" ? -.25 * u : 0;
  const nubs = {idle: [-.15, -.15], salute: [.9, -.1], cheer: [1.0, 1.0], headscratch: [1.25, -.2], nubup: [.75, -.15], freeze: [.6, .6], lookdown: [-.25, -.25]}[clPose] || [-.15, -.15];
  clArms.forEach((a, i) => { const lift = nubs[i === 1 ? 0 : 1] + (clPose === "cheer" ? .3 * Math.sin(t * 12 + i) : 0) + (clPose === "headscratch" && i === 1 ? .2 * Math.sin(t * 14) : 0) + .12 * cp.talk * Math.sin(t * 10 + i);
    a.sh.rotation.z = a.s * lift; });

  // ----- Codex (hidden behind the monitor until its first line, if the episode says so)
  const up = popT < 0 ? 1 : backOut(clamp((t - popT) / .45));
  const xp = emotionFor("codex", t);
  poseFace(cxFace, xp, t, 2.7);
  const cxPose = dirOf(cur, "codex")[1], cxPrev = dirOf(prev, "codex")[1];
  codex.visible = popT < 0 || t >= popT;
  const back = lerp(cxPrev === "backoff" ? 1 : 0, cxPose === "backoff" ? 1 : 0, seg(t, cur.start - .1, cur.start + .9));
  codex.position.set(.2, lerp(.72, .98, up) + .012 * Math.sin(t * 2.6) + (cxPose === "bounce" ? .02 * Math.abs(Math.sin(t * 8)) * xp.talk : 0), .02 + .14 * back);
  cxBody.rotation.z = dirOf(cur, "codex")[0] === "oops" ? -.25 * seg(t, cur.start, cur.start + .4) : .05 * Math.sin(t * 1.8);
  cxBody.rotation.x = cxPose === "lookdown" ? -.3 * u : -.12 * back;
  cxBody.scale.setScalar(1 + .05 * xp.talk);
  const bonk = cxPose === "bonk" ? Math.abs(Math.sin((t - cur.start) * 9)) : 0;
  cxHands.forEach((h, i) => { const s = i ? 1 : -1;
    h.position.set(s * lerp(.15, .035, bonk), -.02 + (cxPose === "bounce" || cxPose === "popup" ? .06 * Math.abs(Math.sin(t * 7 + i)) : 0) + .05 * (cxPose === "bonk" ? 1 : 0), .02 + .06 * (cxPose === "bonk" ? 1 : 0)); });

  // ----- props and lights the episode asks for
  const fl = DIR[cur.id] && DIR[cur.id].flash;
  alarm.intensity = fl ? 6 * (.5 + .5 * Math.sin((t - cur.start) * 14)) * seg(t, cur.start, cur.start + .2) : 0;
  if (D.LAPTOP) {
    laptop.visible = true;
    const sl = D.LAPTOP.slideIn ? seg(t, beats[0].start, beats[0].start + .9) : 1;
    laptop.position.set(D.LAPTOP.x, .75, lerp(D.LAPTOP.z0, D.LAPTOP.z1, sl));
    lapLight.position.set(D.LAPTOP.x, .9, laptop.position.z + .12); lapLight.intensity = 1.5;
  }
  if (D.extra) D.extra(t, {cur, prev, scene, THREE, devBody, devHead, claude, clBody, codex, cxBody, laptop});

  // ----- camera: hard cut per line, slow push within the shot, small handheld drift
  const shot = SHOTS[cur.scene] || SHOTS.wide;
  const k = seg(t, cur.start - .15, cur.end + .6);
  const P = new THREE.Vector3(...shot.pos), L = new THREE.Vector3(...shot.look);
  const dir = L.clone().sub(P).normalize();
  P.addScaledVector(dir, shot.push * k);
  P.x += Math.sin(t * .9) * .006; P.y += Math.sin(t * 1.3) * .004;
  camera.fov = shot.fov || 38; camera.updateProjectionMatrix();
  camera.position.copy(P); camera.lookAt(L);
  renderer.render(scene, camera);
};
window.renderAt(0);
window.READY = true;
</script>
