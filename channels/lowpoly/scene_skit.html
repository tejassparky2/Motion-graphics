const poseFrom = name => POSES[name] || POSES.rest;
const bodyFrom = name => BODY[name] || [0, 0, 0];
Object.assign(POSES, D.POSES || {});
Object.assign(BODY, D.BODY || {});
const firstShown = beats.find(b => dirOf(b, "codex")[0] !== "hidden");
const popT = (dirOf(beats[0], "codex")[0] === "hidden" && firstShown) ? firstShown.start - .35 : -1;

window.renderAt = function (t) {
  const [cur, prev] = beatAt(t);
  const u = seg(t, cur.start - .15, cur.start + .2);
  // ----- Dev (and the guest): one routine, keyed by the character's name in the direction file
  function animatePerson(who, R, cur, prev, u, t) {
    const dp = emotionFor(who, t);
    const pose = dirOf(cur, who)[1], pprev = dirOf(prev, who)[1], emo = dirOf(cur, who)[0];
    const pa = poseFrom(pprev), pb = poseFrom(pose);
    R.arms.forEach((a, i) => { const A = pa[1 - i], B = pb[1 - i]; setArm(a, lerp(A[0], B[0], u), lerp(A[1], B[1], u), lerp(A[2], B[2], u)); });
    if (pose === "point" || pose === "pointscreen") R.arms[1].el.rotation.x += Math.sin(t * 9) * .08 * envAt(who, t);
    if (pose === "lunge") R.arms.forEach((a, i) => a.el.rotation.x += Math.sin(t * 18 + i) * .12);
    if (pose === "type") R.arms.forEach((a, i) => { a.el.rotation.x += Math.abs(Math.sin(t * 21 + i * 1.7)) * .22; a.sh.rotation.x += Math.sin(t * 15 + i) * .04; });
    if (pose === "shrug") { const k = seg(t, cur.start, cur.start + .35) * (1 - seg(t, cur.end, cur.end + .4)); R.arms.forEach(a => { a.sh.rotation.z += a.s * .9 * k; a.el.rotation.x -= 1.2 * k; }); }
    const ba = bodyFrom(pprev), bb = bodyFrom(pose);
    const lean = lerp(ba[0], bb[0], u), sink = lerp(ba[1], bb[1], u), hdown = lerp(ba[2], bb[2], u);
    R.body.position.z = .1 * lean;
    R.body.position.y = Math.sin(t * 2.2) * .004 - .06 * sink;
    R.body.rotation.x = .12 * lean - .08 * sink;
    R.head.rotation.x = .18 + hdown + .25 * dp.talk * Math.sin(t * 11) * .3;
    R.head.rotation.z = .06 * Math.sin(t * 1.3) + (emo === "hopeful" ? .15 * u : 0);
    R.head.rotation.y = emo === "casual" ? -.35 * u : -.05;
    // reactions: flinch (jolt back on a shock), doubletake (look away, snap back), slump (sink over the line), sitback
    if (pose === "flinch") { const k = Math.exp(-(t - cur.start + .1) * 6) * (t > cur.start - .1 ? 1 : 0); R.body.position.z -= .08 * k; R.body.rotation.x -= .25 * k; R.head.rotation.x -= .2 * k; }
    if (pose === "doubletake") {                           // glance away, hold, snap back with a small overshoot
      const q = (t - cur.start) / Math.max(.8, cur.end - cur.start);
      const away = q < .3 ? ease(q / .3) : q < .5 ? 1 : 1 - ease((q - .5) / .14);
      const over = q >= .64 && q < .9 ? Math.sin((q - .64) / .26 * Math.PI) * .25 : 0;
      R.head.rotation.y += -.55 * Math.max(0, away) + over;
    }
    if (pose === "slump") { const k = seg(t, cur.start, cur.end + .5); R.body.position.y -= .07 * k; R.body.rotation.x -= .1 * k; R.head.rotation.x += .35 * k; }
    if (pose === "nod") R.head.rotation.x += .16 * Math.max(0, Math.sin((t - cur.start) * 9)) * (1 - seg(t, cur.start + .6, cur.start + 1.0)) * (t >= cur.start ? 1 : 0);
    if (pose === "sitback") { const k = seg(t, cur.start - .1, cur.start + .4); R.body.position.z -= .1 * k; R.body.rotation.x -= .18 * k; R.head.rotation.x -= .1 * k; }
    R.mug.visible = pose === "sip";
    const hood = pose === "hood" ? seg(t, cur.start - .1, cur.start + .5) : (pprev === "hood" ? 1 - u : 0);
    R.hoodUp.visible = hood > .02 || !!(who === "dev" && cur.id === beats[beats.length - 1].id && D.HOOD_AT_END);
    R.hoodUp.rotation.x = lerp(-1.7, .35, hood);
    poseFace(R.face, dp, t, who === "dev" ? .4 : 1.1);
    R.face.group.visible = hood < .85;
  }
  animatePerson("dev", DEV, cur, prev, u, t);
  if (GUEST) animatePerson(GUEST.name, GUEST.rig, cur, prev, u, t);
  const devPose = dirOf(cur, "dev")[1];

  // ----- Claude (CAST.claudeFrom: hidden until that line, then pops up from behind the monitor)
  if (D.CAST && D.CAST.claudeFrom) {
    const pc = beats.find(b => b.id === D.CAST.claudeFrom).start - .5;
    claude.visible = t >= pc;
    claude.position.y = lerp(.5, .75, backOut(clamp((t - pc) / .45)));
  }
  const cp = emotionFor("claude", t);
  poseFace(clFace, cp, t, 1.9);
  const clPose = dirOf(cur, "claude")[1];
  const frozen = clPose === "freeze" || clPose === "strain";
  const hop = clPose === "cheer" ? Math.abs(Math.sin((t - cur.start) * 9)) * .03 * (1 - seg(t, cur.start + .8, cur.start + 1.4)) : 0;
  const talkBob = cp.talk * .012 * Math.abs(Math.sin(t * 16));
  clBody.position.y = hop + talkBob + (frozen ? 0 : .004 * Math.sin(t * 3));
  clBody.scale.set(1 + .06 * cp.talk, 1 - .05 * cp.talk + (clPose === "cheer" ? .04 * hop / .03 : 0) - (frozen ? .03 * u : 0), 1);
  if (clPose === "shrink") { const k = seg(t, cur.start - .1, cur.start + .5); clBody.scale.multiplyScalar(1 - .22 * k); clBody.position.y -= .01 * k; }
  if (clPose === "strain") {                     // thinking so hard it trembles and squashes, getting worse
    const k = seg(t, cur.start, cur.end);
    clBody.position.x = .004 * (1 + 2 * k) * Math.sin(t * 61);
    clBody.scale.y *= 1 - .07 * k; clBody.scale.x *= 1 + .05 * k;
  } else clBody.position.x = 0;
  clBody.rotation.z = clPose === "headscratch" ? .12 * Math.sin(t * 2) : clPose === "salute" ? .08 : frozen ? .03 * Math.sin(t * 40) * (1 - seg(t, cur.start, cur.start + .3)) : 0;
  clBody.rotation.y = clPose === "headscratch" ? .35 : clPose === "lookother" ? -.4 * seg(t, cur.start - .1, cur.start + .3) : 0;
  clBody.rotation.x = clPose === "lookdown" ? -.25 * u : clPose === "nod" ? .2 * Math.max(0, Math.sin((t - cur.start) * 9)) * (1 - seg(t, cur.start + .6, cur.start + 1.0)) : 0;
  const nubs = {idle: [-.15, -.15], salute: [.9, -.1], cheer: [1.0, 1.0], headscratch: [1.25, -.2], nubup: [.75, -.15], freeze: [.6, .6], lookdown: [-.25, -.25]}[clPose] || [-.15, -.15];
  clArms.forEach((a, i) => { const lift = nubs[i === 1 ? 0 : 1] + (clPose === "cheer" ? .3 * Math.sin(t * 12 + i) : 0) + (clPose === "headscratch" && i === 1 ? .2 * Math.sin(t * 14) : 0) + .12 * cp.talk * Math.sin(t * 10 + i);
    a.sh.rotation.z = a.s * lift; });

  // ----- Codex (hidden behind the monitor until its first line, if the episode says so; CAST.codex=false: not in it)
  const up = popT < 0 ? 1 : backOut(clamp((t - popT) / .45));
  const xp = emotionFor("codex", t);
  poseFace(cxFace, xp, t, 2.7);
  const cxPose = dirOf(cur, "codex")[1], cxPrev = dirOf(prev, "codex")[1];
  codex.visible = (popT < 0 || t >= popT) && !(D.CAST && D.CAST.codex === false);
  const back = lerp(cxPrev === "backoff" ? 1 : 0, cxPose === "backoff" ? 1 : 0, seg(t, cur.start - .1, cur.start + .9));
  codex.position.set(CX0[0], lerp(.72, .98, up) + .012 * Math.sin(t * 2.6) + (cxPose === "bounce" ? .02 * Math.abs(Math.sin(t * 8)) * xp.talk : 0), CX0[1] + .14 * back);
  codex.rotation.y = Math.PI + (cxPose === "spin" ? 2 * Math.PI * seg(t, cur.start, cur.start + .6) : 0);   // a happy spin
  if (cxPose === "lookother") cxBody.rotation.y = .4 * seg(t, cur.start - .1, cur.start + .3);
  else if (cxPose === "headshake") cxBody.rotation.y = .35 * Math.sin((t - cur.start) * 14) * (1 - seg(t, cur.start + .5, cur.start + .9)) * (t >= cur.start ? 1 : 0);
  else cxBody.rotation.y = 0;
  cxBody.rotation.z = dirOf(cur, "codex")[0] === "oops" ? -.25 * seg(t, cur.start, cur.start + .4) : .05 * Math.sin(t * 1.8);
  cxBody.rotation.x = cxPose === "lookdown" ? -.3 * u : cxPose === "nod" ? .18 * Math.max(0, Math.sin((t - cur.start) * 9)) * (1 - seg(t, cur.start + .6, cur.start + 1.0)) : -.12 * back;
  cxBody.scale.setScalar(1 + .05 * xp.talk);
  const bonk = cxPose === "bonk" ? Math.abs(Math.sin((t - cur.start) * 9)) : 0;
  cxHands.forEach((h, i) => { const s = i ? 1 : -1;
    h.position.set(s * lerp(.15, .035, bonk), -.02 + (cxPose === "bounce" || cxPose === "popup" ? .06 * Math.abs(Math.sin(t * 7 + i)) : 0) + .05 * (cxPose === "bonk" ? 1 : 0), .02 + .06 * (cxPose === "bonk" ? 1 : 0)); });
  // more Codex moves: wave, glitch (visor stutters), stuck mid-spin, off (waves, then visor dies and it sinks), gone
  const waveHand = () => cxHands[1].position.set(.14, .07 + .025 * Math.sin(t * 14), 0);
  if (cxPose === "wave") waveHand();
  let dark = cxPose === "glitch" && Math.sin(t * 47) * Math.sin(t * 13.7) > .15;
  if (cxPose === "glitch") cxBody.position.x = .006 * Math.sin(t * 53); else cxBody.position.x = 0;
  if (cxPose === "stuck") { codex.rotation.y = Math.PI + 2.3; cxBody.rotation.z = .02; codex.position.y = .98; }
  if (cxPose === "off" || cxPose === "gone") {
    const k = cxPose === "gone" ? 1 : seg(t, cur.end - .05, cur.end + .8);
    if (k < .02) waveHand();
    codex.position.y -= .5 * k; dark = k > .02;
    codex.visible = codex.visible && k < 1;
  }
  VIS.color.setHex(dark ? 0x18202c : 0x9ff0ff);

  // ----- props and lights the episode asks for
  const fl = DIR[cur.id] && DIR[cur.id].flash;
  alarm.intensity = fl ? 6 * (.5 + .5 * Math.sin((t - cur.start) * 14)) * seg(t, cur.start, cur.start + .2) : 0;
  if (D.LAPTOP) {
    laptop.visible = true;
    const sl = D.LAPTOP.slideIn ? seg(t, beats[0].start, beats[0].start + .9) : 1;
    laptop.position.set(D.LAPTOP.x, .75, lerp(D.LAPTOP.z0, D.LAPTOP.z1, sl));
    lapLight.position.set(D.LAPTOP.x, .9, laptop.position.z + .12); lapLight.intensity = 1.5;
  }
  const hd = DIR[cur.id] && DIR[cur.id].headdesk;          // Dev folds at the hips onto the desk
  if (hd !== undefined) {
    const kk = clamp((t - cur.start - hd) / .9), e = kk * kk * (3 - 2 * kk), th = 1.0 * e;
    devBody.rotation.x += th; devBody.position.y += .55 - .55 * Math.cos(th); devBody.position.z -= .55 * Math.sin(th) + .08 * e;
    devHead.rotation.x += .25 * e;
  }
  if (D.extra) D.extra(t, {cur, prev, scene, THREE, devBody, devHead, claude, clBody, codex, cxBody, laptop});

  driftMotes(t);
  if (deskTick) deskTick(t);
  // ----- camera: hard cut per line (or at the line's own cuts), slow push within the shot, small handheld drift
  let shotName = cur.scene, s0 = cur.start - .15, s1 = cur.end + .6;
  const cuts = DIR[cur.id] && DIR[cur.id].cuts;          // [[fraction of the line, shot], ...]
  if (cuts) {
    const len = Math.max(.3, cur.end - cur.start);
    cuts.forEach(([f, name], i) => {
      const a = cur.start + f * len;
      if (i === 0 || t >= a) { shotName = name; s0 = i === 0 ? cur.start - .15 : a; s1 = i + 1 < cuts.length ? cur.start + cuts[i + 1][0] * len : cur.end + .6; }
    });
  }
  const shot = SHOTS[shotName] || SHOTS.wide;
  const k = seg(t, s0, s1);
  const P = new THREE.Vector3(...shot.pos), L = new THREE.Vector3(...shot.look);
  const trackRig = shot.track === "dev" ? DEV : (GUEST && shot.track === GUEST.name) ? GUEST.rig : null;
  if (trackRig) {                                          // keep the face framed however far the character leans
    const h = trackRig.head.getWorldPosition(new THREE.Vector3());
    L.set(L.x, h.y + (shot.look[1] - 1.27), h.z + (shot.look[2] - trackRig.group.position.z));
  }
  const dir = L.clone().sub(P).normalize();
  P.addScaledVector(dir, shot.push * k);
  const pun = DIR[cur.id] && DIR[cur.id].punch;              // punch-in: a quick extra push that lands on the reveal word
  if (pun) P.addScaledVector(dir, (typeof pun === "number" ? pun : .14) * seg(t, cur.end - .5, cur.end - .05));
  P.x += Math.sin(t * .9) * .006; P.y += Math.sin(t * 1.3) * .004;
  camera.fov = shot.fov || 38; camera.updateProjectionMatrix();
  camera.position.copy(P); camera.lookAt(L);
  bokeh.uniforms.focus.value = P.distanceTo(L);
  composer.render();
};
window.renderAt(0);
window.READY = true;
</script>
</body>
</html>
